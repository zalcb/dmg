name: Core regression tests
on: [push, pull_request]
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Sentrux
        run: |
          curl -fsSL https://github.com/sentrux/sentrux/releases/download/v0.5.7/sentrux-linux-x86_64 -o /tmp/sentrux
          echo '3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6  /tmp/sentrux' | sha256sum -c -
          chmod +x /tmp/sentrux
      - name: Preserve structural baseline
        run: |
          /tmp/sentrux check . | tee /tmp/sentrux-check.txt
          /tmp/sentrux gate .
          test "$(awk '/^Quality:/ {print $2}' /tmp/sentrux-check.txt)" -ge 8034
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test test-debug test-asan
  frontend:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install raylib pkg-config
      - run: make -j3 all debug asan
      - run: python3 tests/bench_compare.py --cycles 4194304 --runs 1
